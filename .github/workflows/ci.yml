name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  SRC: src/core.c src/parse.c src/eval.c src/builtins.c src/main.c

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (strict)
        run: gcc -O2 -std=c99 -Wall -Wextra -Wpedantic -Wshadow -Wstrict-prototypes -Wclobbered -Werror -o mew $SRC -lm
      - name: test
        run: python3 tests/run.py

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: clang -O2 -std=c99 -Wall -Wextra -Wpedantic -Werror -o mew $SRC -lm
      - name: test
        run: python3 tests/run.py

  linux-tcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tcc
        run: sudo apt-get update && sudo apt-get install -y tcc
      - name: build
        run: tcc -std=c99 -o mew $SRC -lm
      - name: test
        run: python3 tests/run.py

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build with asan and ubsan
        run: gcc -g -O1 -std=c99 -Wall -Wextra -fsanitize=address,undefined -o mew $SRC -lm
      - name: test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: python3 tests/run.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: clang -O2 -std=c99 -Wall -Wextra -Wpedantic -Werror -o mew $SRC
      - name: test
        run: python3 tests/run.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (mingw)
        shell: bash
        run: gcc -O2 -std=c99 -Wall -Wextra -Wpedantic -Werror -o mew.exe src/core.c src/parse.c src/eval.c src/builtins.c src/main.c
      - name: test
        run: python tests/run.py
